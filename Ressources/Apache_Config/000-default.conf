<VirtualHost *:80>

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	<Directory /var/www/html>
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	alias /upload /var/www/html/meterpyter/upload
	alias /download /var/www/html/meterpyter/download
	alias /ransomware /var/www/html/meterpyter/ransomware

	<Location /upload>
		DAV On
		Options Indexes
		AllowOverride None
		Require all granted
	</Location>

</VirtualHost>
